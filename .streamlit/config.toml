[theme]
base = "light"
primaryColor = "#18181B"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F4F4F5"
textColor = "#18181B"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
headingFont = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
borderColor = "#E4E4E7"
baseRadius = "6px"
baseFontSize = 14
showWidgetBorder = true

[theme.sidebar]
backgroundColor = "#FAFAFA"
secondaryBackgroundColor = "#F4F4F5"

[client]
toolbarMode = "minimal"
showErrorDetails = false

[browser]
gatherUsageStats = false
